{% set xorg_name = "util-macros" %}
{% set xorg_category = "util" %}
{% set name = "xorg-" ~ xorg_name %}
{% set version = "1.20.2" %}
{% set sha256 = "9ac269eba24f672d7d7b3574e4be5f333d13f04a7712303b1821b2a51ac82e8e" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.xz
  sha256: {{ sha256 }}

build:
  number: 2
  detect_binary_files_with_prefix: true

requirements:
  build:
    - pkg-config                   # [unix]
    - m2-base                      # [win]
    - make                         # [unix]
    - m2-make                      # [win]
    - {{ compiler("c") }}          # [unix]
    - {{ stdlib("c") }}            # [unix]

test:
  requires:
    - pkg-config                    # [unix]
  commands:
    - test -f ${PREFIX}/share/aclocal/xorg-macros.m4                    # [unix]
    - test -f ${PREFIX}/share/pkgconfig/xorg-macros.pc                  # [unix]
    - pkg-config --modversion xorg-macros                               # [unix]
    - if not exist %LIBRARY_PREFIX%\share\aclocal\xorg-macros.m4 exit 1  # [win]
    - if not exist %LIBRARY_PREFIX%\share\pkgconfig\xorg-macros.pc exit 1  # [win]
    - 'findstr /C:"Version: {{ version }}" %LIBRARY_PREFIX%\share\pkgconfig\xorg-macros.pc'  # [win]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Development utility macros for X.org software.

extra:
  recipe-maintainers:
    - pkgw
